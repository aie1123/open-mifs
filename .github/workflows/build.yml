name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 OpenMIFS.exe
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 脚本语法检查
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors[0].Message)"
              $errors | ForEach-Object { Write-Host "  L$($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "OK  $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: CLI 动作一致性检查
        shell: pwsh
        run: |
          # 踩过的坑：给 mifs.ps1 加了新的 switch 分支，却忘了加进 ValidateSet，
          # 结果参数校验直接把命令拒掉（v0.3.5 的 `fan` 就是这样漏出去的）。
          $text = Get-Content -Raw src/mifs.ps1
          $vs = [regex]::Match($text, "\[ValidateSet\(([^)]*)\)\]").Groups[1].Value
          $allowed = [regex]::Matches($vs, "'([^']+)'") | ForEach-Object { $_.Groups[1].Value }
          $sw = [regex]::Match($text, "(?s)switch \(\`$Action\) \{(.*?)\r?\n    \}").Groups[1].Value
          $cases = [regex]::Matches($sw, "(?m)^\s{8}'([^']+)'\s*\{") | ForEach-Object { $_.Groups[1].Value }
          if ($cases.Count -lt 5) { Write-Host "::error::没能解析出 switch 分支（正则失效？）"; exit 1 }
          Write-Host "ValidateSet: $($allowed -join ', ')"
          Write-Host "switch 分支: $($cases -join ', ')"
          $missing = @($cases | Where-Object { $_ -notin $allowed })
          if ($missing.Count) {
            Write-Host "::error::$($missing -join ', ') 在 switch 里有分支，但不在 ValidateSet 里 —— 该动作会被参数校验直接拒绝"
            exit 1
          }
          Write-Host 'OK 所有 switch 分支都在 ValidateSet 内'

      - name: UTF-8 BOM 检查
        shell: pwsh
        run: |
          # pwsh 7 能读无 BOM 的 UTF-8，但 Windows PowerShell 5.1 会把中文读成乱码
          # （`.ps1` 甚至会语法报错）。所以强制要求源码带 BOM —— 这个坑踩过两次了。
          $failed = $false
          $files = @(Get-ChildItem -Recurse -Include *.ps1, *.cs -File)
          foreach ($f in $files) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            $hasBom = ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)
            if (-not $hasBom) {
              $failed = $true
              Write-Host "::error file=$($f.FullName)::缺少 UTF-8 BOM（Windows PowerShell 5.1 会把中文读成乱码）"
            } else {
              Write-Host "BOM OK  $($f.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: 生成图标（验证生成器可用）
        shell: pwsh
        run: ./build/make-icon.ps1

      - name: 构建 exe
        shell: pwsh
        run: ./build/build.ps1

      - name: 记录产物信息
        shell: pwsh
        run: |
          $exe = Get-Item dist/OpenMIFS.exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host "文件: $($exe.FullName)"
          Write-Host "大小: $($exe.Length) 字节"
          Write-Host "SHA256: $hash"
          @"
          ## OpenMIFS 构建结果

          | 项目 | 值 |
          | :--- | :--- |
          | 文件 | ``OpenMIFS.exe`` |
          | 大小 | $($exe.Length) 字节 ($([math]::Round($exe.Length/1KB,1)) KB) |
          | SHA256 | ``$hash`` |
          | 版本 | $($exe.VersionInfo.FileVersion) |

          单个 exe，无外部依赖，只要求 Windows 自带的 .NET Framework 4.8。
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenMIFS-${{ github.sha }}
          path: dist/OpenMIFS.exe
          if-no-files-found: error

      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenMIFS.exe
          generate_release_notes: true
          body: |
            ## OpenMIFS ${{ github.ref_name }}

            下载下方的 `OpenMIFS.exe`，双击运行即可（会弹出 UAC，需要管理员权限）。

            - 单个 exe，无外部依赖，只要求 Windows 自带的 .NET Framework 4.8
            - 常驻任务栏通知区域，可后台运行
            - 首次运行建议先跑 `probe` / `test` 确认本机支持哪些功能，见 README

            完整改动见 [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。
